
name: Darkroom iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Resolve dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -workspace Darkroom.xcworkspace \
            -scheme Darkroom

      - name: Build iOS archive
        run: |
          xcodebuild archive \
            -workspace Darkroom.xcworkspace \
            -scheme Darkroom \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Darkroom.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R "$RUNNER_TEMP/Darkroom.xcarchive/Products/Applications/Darkroom.app" Payload/
          zip -r Darkroom.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Darkroom-IPA
          path: Darkroom.ipa
          retention-days: 7
